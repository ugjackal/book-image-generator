<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whoka Story Studio</title>
    <meta name="theme-color" content="#f2b36a" />
    <link rel="icon" href="./assets/whoka-favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/whoka-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/whoka-favicon-16.png" />
    <link rel="apple-touch-icon" href="./assets/whoka-apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo" src="./assets/whoka-sunrise-logo.png" alt="Whoka constellation tree logo" />
          <div>
            <p class="eyebrow">Whoka Digital Media</p>
            <h1>Whoka Story Studio</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <label class="book-switcher">
            <span>Open book</span>
            <select id="bookSelect"></select>
          </label>
          <button class="primary-button" id="newBookButton" type="button">Start new book</button>
          <button class="ghost-button" id="addPageButton" type="button">Add page</button>
        </div>
      </header>

      <div class="global-status" id="globalStatus">
        <strong id="globalStatusLabel">Ready</strong>
        <span id="globalStatusText">Choose a page and generate its illustration.</span>
      </div>

      <section class="start-book panel" id="startBookPanel" hidden>
        <div class="section-head">
          <div>
            <p class="eyebrow">Start book</p>
            <h2>Set up the story</h2>
          </div>
          <button class="ghost-button" id="cancelStartBookButton" type="button">Cancel</button>
        </div>

        <div class="start-steps">
          <section class="start-step">
            <span class="step-number">1</span>
            <div class="form-grid">
              <label class="field">
                <span>Book title</span>
                <input id="startBookTitle" type="text" placeholder="My New Book" />
              </label>

              <label class="field">
                <span>Author</span>
                <div class="inline-control">
                  <select id="startAuthorSelect"></select>
                  <input id="startAuthorName" type="text" placeholder="Or type a new author" />
                </div>
              </label>

              <label class="field span-2">
                <span>Target audience</span>
                <select id="startAudienceSelect">
                  <option value="3-5">Children age 3-5</option>
                  <option value="3-8" selected>Children age 3-8</option>
                  <option value="6-8">Children age 6-8</option>
                  <option value="9-12">Children age 9-12</option>
                </select>
              </label>
            </div>
          </section>

          <section class="start-step">
            <span class="step-number">2</span>
            <label class="field">
              <span>Paste the full story</span>
              <textarea
                id="startStoryManuscript"
                rows="10"
                placeholder="Paste the whole story here. The tool will divide it into picture-book pages."
              ></textarea>
            </label>
          </section>

          <section class="start-step">
            <span class="step-number">3</span>
            <div class="start-actions">
              <label class="field compact-field">
                <span>Page count</span>
                <input id="startPageCount" type="number" min="1" max="64" placeholder="Auto" />
              </label>
              <button class="primary-button" id="createStartedBookButton" type="button">Create book pages</button>
            </div>
          </section>
        </div>
      </section>

      <section class="workspace">
        <aside class="sidebar panel">
          <section class="stack">
            <div class="section-head">
              <div>
                <p class="eyebrow">Book</p>
                <h2>Details</h2>
              </div>
            </div>

            <label class="field">
              <span>Title</span>
              <input id="projectTitle" type="text" placeholder="Book title" />
            </label>

            <label class="field">
              <span>Author</span>
              <select id="authorSelect"></select>
            </label>

            <label class="field">
              <span>Add author</span>
              <div class="inline-control">
                <input id="newAuthorName" type="text" placeholder="Author name" />
                <button class="ghost-button" id="addAuthorButton" type="button">Add</button>
              </div>
            </label>

            <label class="field">
              <span>Book cover</span>
              <input id="coverInput" type="file" accept="image/*" />
            </label>

            <label class="field">
              <span>Print size</span>
              <div class="print-size-toolbar" id="printSizeToolbar"></div>
              <select id="printSizeSelect">
                <option value="landscape-10x8">Landscape picture book 12 x 8 in</option>
                <option value="portrait-8x10">Portrait picture book 8 x 12 in</option>
                <option value="square-10x10">Square picture book 10 x 10 in</option>
              </select>
            </label>

            <div class="cover-preview" id="coverPreview">
              <div class="empty-state">No cover loaded</div>
            </div>

            <button class="ghost-button full-width" id="clearCoverButton" type="button">Clear cover</button>
          </section>

          <section class="stack page-list-section">
            <div class="section-head">
              <div>
                <p class="eyebrow">Pages</p>
                <h2>Manuscript</h2>
              </div>
            </div>
            <div class="page-list" id="pageList"></div>
          </section>
        </aside>

        <section class="editor panel">
          <section class="editor-card story-card">
            <div class="section-head">
              <div>
                <p class="eyebrow">Story</p>
                <h2>Paste a full story</h2>
              </div>
              <button class="primary-button" id="buildPagesButton" type="button">Create page drafts</button>
            </div>

            <div class="form-grid">
              <label class="field">
                <span>Target audience</span>
                <select id="audienceSelect">
                  <option value="3-5">Children age 3-5</option>
                  <option value="3-8">Children age 3-8</option>
                  <option value="6-8">Children age 6-8</option>
                  <option value="9-12">Children age 9-12</option>
                </select>
              </label>

              <label class="field">
                <span>Page count</span>
                <input id="suggestedPageCount" type="number" min="1" max="64" placeholder="Auto" />
              </label>

              <label class="field span-2">
                <span>Full story manuscript</span>
                <textarea
                  id="storyManuscript"
                  rows="8"
                  placeholder="Paste the whole story here, then create page drafts..."
                ></textarea>
              </label>
            </div>
          </section>

          <section class="editor-card page-card" id="pageEditorCard">
            <div class="section-head">
              <div>
                <p class="eyebrow">Editing</p>
                <h2 id="activePageLabel">Page 1</h2>
              </div>
              <div class="button-row">
                <button class="ghost-button" id="duplicatePageButton" type="button">Duplicate</button>
                <button class="ghost-button danger-button" id="deletePageButton" type="button">Delete</button>
              </div>
            </div>

            <form id="pageForm" class="form-grid">
              <label class="field span-2">
                <span>Illustration direction</span>
                <textarea
                  id="sceneDescription"
                  rows="5"
                  placeholder="Describe what should happen in the illustration..."
                ></textarea>
              </label>

              <label class="field">
                <span>Characters</span>
                <input id="pageCharacters" type="text" placeholder="Layla, Ginger" list="characterNames" />
                <datalist id="characterNames"></datalist>
              </label>

              <label class="field">
                <span>Setting</span>
                <input id="pageSetting" type="text" placeholder="Backyard, barn, pasture..." />
              </label>

              <label class="field">
                <span>Mood</span>
                <input id="pageMood" type="text" placeholder="Tender, playful, brave..." />
              </label>

              <label class="field">
                <span>Lighting</span>
                <input id="pageLighting" type="text" placeholder="Warm afternoon light" />
              </label>

              <label class="field span-2">
                <span>Text placement</span>
                <input id="textSpace" type="text" placeholder="Leave quiet open space at top left for the story text." />
              </label>

              <label class="field span-2">
                <span>Composition</span>
                <input id="composition" type="text" placeholder="Landscape picture-book page, full bodies visible..." />
              </label>

              <label class="field span-2" hidden>
                <span>Layout</span>
                <select id="pageLayout">
                  <option value="stacked-image-top">Image top, text bottom</option>
                  <option value="stacked-text-top">Text top, image bottom</option>
                  <option value="spread-text-left">Text left, image right</option>
                  <option value="spread-image-left">Image left, text right</option>
                  <option value="overlay-centered">Background image, centered text</option>
                  <option value="overlay-top">Background image, top text</option>
                  <option value="overlay-bottom">Background image, bottom text</option>
                </select>
              </label>

            </form>            

            <label class="field">
              <span>Prompt used</span>
              <textarea id="promptOutput" rows="10" readonly></textarea>
            </label>

            <button class="ghost-button full-width" id="copyPromptButton" type="button" disabled>Copy prompt</button>
          </section>

          <section class="editor-card character-card">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Cast</p>
                <h2>Available characters</h2>
              </div>
            </div>
            <div class="character-list" id="characterList"></div>
          </section>
        </section>

        <aside class="preview panel">
          <section class="stack">
            <div class="section-head">
              <div>
                <p class="eyebrow">Book</p>
                <h2>Full preview</h2>
              </div>
            </div>
            <article class="book-page-preview full-book-preview" id="fullBookPreview"></article>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
